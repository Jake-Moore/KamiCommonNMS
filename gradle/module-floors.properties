# The Java floor of every module under versions/, in one place.
#
# Read by three things that would otherwise each keep their own copy:
#   versions/build.gradle.kts          sets the toolchain, the emitted target, and the declared
#                                      variant metadata from it
#   gradle/verify-floors.gradle.kts    checks the shaded jar's bytecode against it
#   gradle/verify-dispatch-floors...   checks that no dispatch ladder sends a server to a module
#                                      its JVM cannot load
#
# It lives in a properties file rather than one of the build scripts because a Gradle script plugin
# cannot export a value to another script plugin, so sharing it any other way means duplicating it.
# Three copies had already drifted apart once: v_latest was raised to 25 in two of them while a
# third still said 21, and the audit run against the stale copy reported no violations because it
# was asking the wrong question.
#
# A module with no entry here fails the build. Inheriting "whatever the build happened to be
# running" is how every module ended up at Java 21 in the first place.

# Minecraft 1.8 to 1.16.5 ran on Java 8, and WorldEdit/WorldGuard 6 are Java 7 bytecode.
v1_8_R1  = 8
v1_8_R2  = 8
v1_8_R3  = 8
v1_9_R1  = 8
v1_9_R2  = 8
v1_10_R1 = 8
v1_11_R1 = 8
v1_12_R1 = 8
v1_13_R1 = 8
v1_13_R2 = 8
v1_14_R1 = 8
v1_15_R1 = 8
v1_16_R1 = 8
v1_16_R2 = 8
v1_16_R3 = 8
worlds6  = 8

# 1.17 is the one release that required exactly 16.
v1_17_R1 = 16

# 1.18 to 1.20.4 required 17. worlds7 joins them because worldguard-bukkit 7.0.9 is entirely
# class-file major 61, so a lower target here would be a promise we cannot keep.
v1_18_R1 = 17
v1_18_R2 = 17
v1_19_R1 = 17
v1_19_R2 = 17
v1_19_R3 = 17
v1_20_R1 = 17
v1_20_R2 = 17
v1_20_R3 = 17
worlds7  = 17

# 1.20.5 onward required 21.
v1_20_CB  = 21
v1_21_4   = 21
v1_21_9   = 21
v1_21_11  = 21

# 26.x requires Java 25, so v_latest targets 25.
#
# This only became possible once the fallthrough implementations were forked into v1_21_11. Before
# that, v_latest was doing two jobs: the 26.x module, and the fallthrough for every capability that
# had never needed a fork, which meant a 1.21.11 server loaded it for blockUtil, entityMethods,
# nmsItemMethods, packetHandler and teleporter. Raising it to 25 in that state killed 1.21.11 with
# UnsupportedClassVersionError on NmsBundleImpl.
#
# verifyFloors could not see that, and cannot: it reads bytecode, and the whole point of resolving
# modules by name is that no lower-floor class references them. Only verifyDispatchFloors, which
# evaluates the ladders themselves, catches it.
v_latest = 25
