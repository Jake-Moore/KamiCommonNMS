# The ~30 version modules are independent, so building them concurrently is worth ~40% off the
# wall clock. Measured over 5 runs each: median 15s parallel against 25s serial.
org.gradle.parallel=true

# The release workflow builds this project three times on three runners: validate, then build and
# docs. The Gradle build cache lets the later two reuse validate's compiled output instead of
# starting from nothing. gradle/actions/setup-gradle persists it between jobs.
org.gradle.caching=true
