# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Gradle Publish & Deploy Docs (on push)

on:
  push:
    branches: [ "main" ]
    # A merge to main publishes immediately, and the publish OVERWRITES whatever already sits at
    # that coordinate. So a change that cannot affect the artifact must not trigger one. Merging
    # the Renovate config PR republished spigot-nms 1.2.23 over itself for exactly this reason.
    #
    # Blacklist, not whitelist: a path forgotten here causes an unnecessary publish, which is
    # visible and harmless-ish. A path forgotten in a whitelist means a real release silently
    # never happens, which is far worse.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.idea/**'
      - '.gitignore'
      - 'LICENSE'
      - 'renovate.json'
  # Manual trigger, so a release can be cut without pushing, and so the workflow can be
  # exercised without waiting for a qualifying change.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      paperVersion: ${{ steps.extract_version.outputs.paperVersion }}
      skipPublish: ${{ steps.skip_check.outputs.skip }}
      alreadyPublished: ${{ steps.published_check.outputs.already }}

    steps:
      - uses: actions/checkout@v7

      # Label escape hatch. This workflow triggers on push, where there is no PR context, so the
      # merge commit is mapped back to its pull request and that PR's labels are read.
      # Put `skip-publish` on a PR to merge it without cutting a release.
      - name: Check for skip-publish label
        id: skip_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                     --jq '.[].labels[].name' 2>/dev/null | tr '\n' ' ')
          echo "labels on the originating PR: ${labels:-none}"
          if printf '%s' "$labels" | grep -qw 'skip-publish'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip-publish label present, publishing and docs will be skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDKs 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      # Configure: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Cache paperweight setup
        uses: actions/cache@v6
        with:
          path: |
            .gradle/caches/paperweight
            versions/*/.gradle/caches/paperweight
          key: paperweight-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'versions/*/build.gradle.kts') }}
          restore-keys: paperweight-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Follow the wrapper rather than pinning. These were pinned to a fixed version while the
          # wrapper said something else, so CI and local builds ran different Gradle versions and a
          # wrapper bump could never affect CI.
          gradle-version: wrapper

      - name: Build with Gradle (1.8.8)
        run: gradle build
        env:
          LUXIOUS_NEXUS_USER: ${{ secrets.MAVEN_NAME }}
          LUXIOUS_NEXUS_PASS: ${{ secrets.MAVEN_SECRET }}
          MC_SERVER_NEWEST_API: "false"

      - name: Build with Gradle (newest Paper API)
        run: gradle build
        env:
          LUXIOUS_NEXUS_USER: ${{ secrets.MAVEN_NAME }}
          LUXIOUS_NEXUS_PASS: ${{ secrets.MAVEN_SECRET }}
          MC_SERVER_NEWEST_API: "true"

      - name: Extract Version from Gradle
        id: extract_version
        run: |
          gradle clean
          version=$(gradle properties -q | grep "^version:" | awk '{print $2}')
          echo "version=$version" >> $GITHUB_OUTPUT
          paperVersion=$(gradle printPaperVersion -q | tr -d '[:space:]')
          echo "paperVersion=$paperVersion" >> $GITHUB_OUTPUT

      # Never overwrite a release that already exists.
      #
      # A publish to this Nexus REPLACES whatever sits at the coordinate, and merging without a
      # version bump has silently done that twice. Skipping rather than failing is deliberate: the
      # change stays on the branch and ships with the next version bump, so nothing is lost, and a
      # forgotten bump does not produce an email and a red job for what is a no-op. Renovate PRs
      # bump VERSION themselves via bumpVersions, so this mostly catches hand-merged changes.
      #
      # Only a definite 200 skips. A network error or a 5xx proceeds, because guessing "already
      # published" from an unreachable Nexus would silently drop a real release.
      - name: Skip if this version is already published
        id: published_check
        run: |
          VERSION='${{ steps.extract_version.outputs.version }}'
          URL="https://repo.luxiouslabs.net/repository/maven-releases/com/kamikazejam/kamicommon/spigot-nms/${VERSION}/spigot-nms-${VERSION}.jar"
          code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 30 "$URL" || echo "000")
          echo "HEAD $URL -> $code"
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::spigot-nms ${VERSION} is already published. Skipping publish so the existing release is not overwritten. Bump VERSION in build.gradle.kts to release these changes."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Display Version
        run: |
          echo "Version is ${{ steps.extract_version.outputs.version }}"
          echo "Paper Version is ${{ steps.extract_version.outputs.paperVersion }}"

  build:
    needs: validate
    # Run only on non snapshot versions
    if: "!endsWith(needs.validate.outputs.version, 'SNAPSHOT') && needs.validate.outputs.skipPublish != 'true' && needs.validate.outputs.alreadyPublished != 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Access to Publish a Release
      packages: write # Access to Publish a Package

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDKs 17, 21 and 25
      uses: actions/setup-java@v6
      with:
        java-version: |
          17
          21
          25
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

      # Configure: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Cache paperweight setup
      uses: actions/cache@v6
      with:
        path: |
          .gradle/caches/paperweight
          versions/*/.gradle/caches/paperweight
        key: paperweight-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'versions/*/build.gradle.kts') }}
        restore-keys: paperweight-${{ runner.os }}-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        # Follow the wrapper rather than pinning. These were pinned to a fixed version while the
        # wrapper said something else, so CI and local builds ran different Gradle versions and a
        # wrapper bump could never affect CI.
        gradle-version: wrapper

    - name: Publish with Gradle
      run: gradle publish
      env:
        LUXIOUS_NEXUS_USER: ${{ secrets.MAVEN_NAME }}
        LUXIOUS_NEXUS_PASS: ${{ secrets.MAVEN_SECRET }}

      #--------------------------------------------------------------------------------------------
      #           Update Version Badge
      #--------------------------------------------------------------------------------------------

      # Update the README.md Badge with the new version
    - name: Create Version Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 25b97e226e0ecf38e0135223111fd115
        filename: version.json
        label: Latest Release
        message: "${{ needs.validate.outputs.version }}"
        color: blue

      # Update the README.md Badge with the new paper version
    - name: Create Paper NMS Version Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 25b97e226e0ecf38e0135223111fd115
        filename: paperVersion.json
        label: Last NMS Update
        message: "${{ needs.validate.outputs.paperVersion }}"
        color: orange

  docs:
    needs: validate
    # Run only on non snapshot versions
    if: "!endsWith(needs.validate.outputs.version, 'SNAPSHOT') && needs.validate.outputs.skipPublish != 'true' && needs.validate.outputs.alreadyPublished != 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Allow reading repo contents and writing (for push)
      pages: write         # Allow writing to GitHub Pages
      id-token: write      # Allow OIDC token for authentication

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDKs 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'

      # Configure: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Cache paperweight setup
        uses: actions/cache@v6
        with:
          path: |
            .gradle/caches/paperweight
            versions/*/.gradle/caches/paperweight
          key: paperweight-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'versions/*/build.gradle.kts') }}
          restore-keys: paperweight-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Follow the wrapper rather than pinning. These were pinned to a fixed version while the
          # wrapper said something else, so CI and local builds ran different Gradle versions and a
          # wrapper bump could never affect CI.
          gradle-version: wrapper

      - name: Generate Javadocs
        run: gradle :core:aggregateJavadoc

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy versioned docs
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Deploying docs for version: $VERSION"

          cd gh-pages

          # Delete existing version folder if it exists
          rm -rf "$VERSION"

          # Create version directory
          mkdir -p "$VERSION"

          # Copy new docs to version folder
          cp -r ../core/build/docs/aggregateJavadoc/* "$VERSION"/

          # Update or create 'latest' to point to this version
          rm -rf latest
          cp -r "$VERSION" latest

          echo "Created version folder: $VERSION"
          echo "Updated latest to point to: $VERSION"

      - name: Generate versions.json
        run: |
          cd gh-pages

          # Get all version directories (excluding 'latest' and any files)
          VERSIONS=$(find . -maxdepth 1 -type d \( -name "*.*.*" -o -name "v*" \) | sed 's|./||' | grep -v '^latest$' | grep -v '^\.$' | sort -V -r)

          echo "Found versions: $VERSIONS"

          # Generate versions.json
          echo "{" > versions.json
          echo '  "versions": [' >> versions.json
          first=true
          for version in $VERSIONS; do
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> versions.json
            fi
            echo -n "    \"$version\"" >> versions.json
          done
          echo "" >> versions.json
          echo '  ],' >> versions.json
          echo "  \"latest\": \"${{ needs.validate.outputs.version }}\"" >> versions.json
          echo '}' >> versions.json

          echo "Generated versions.json:"
          cat versions.json

      - name: Generate index.html
        run: |
          cd gh-pages

          # Download the HTML template
          curl -s https://raw.githubusercontent.com/Jake-Moore/Jake-Moore.github.io/refs/heads/main/templates/index-template.html -o template.html

          # Create the dynamic content section in a separate file
          cat > dynamic_content.html << 'EOF'
          <h2>📚 Latest Version</h2>
          <a href="latest/" class="version-link latest">Latest (Recommended)</a>

          <h2>📋 All Versions</h2>
          <div id="versions" class="loading">Loading available versions...</div>

          <script>
          // Load versions
          fetch("versions.json")
              .then(response => {
                  if (!response.ok) throw new Error("Failed to load versions");
                  return response.json();
              })
              .then(data => {
                  const container = document.getElementById("versions");
                  container.innerHTML = "";
                  container.classList.remove("loading");

                  if (data.versions && data.versions.length > 0) {
                      data.versions.forEach(version => {
                          const link = document.createElement("a");
                          link.href = version + "/";
                          link.textContent = `Version ${version}`;
                          link.className = "version-link";
                          container.appendChild(link);
                      });
                  } else {
                      container.innerHTML = "<p>No versions available yet.</p>";
                  }
              })
              .catch(error => {
                  console.error("Error loading versions:", error);
                  document.getElementById("versions").innerHTML = 
                      "<p style=\"color: #dc3545;\">Error loading versions. Please refresh the page.</p>";
              });
          </script>
          EOF

          # Replace placeholders in the template
          sed "s|{{PAGE_TITLE}}|KamiCommon NMS Javadocs|g" template.html | \
          sed "s|{{PAGE_HEADING}}|🚀 KamiCommon NMS Javadocs|g" | \
          sed "s|{{PAGE_DESCRIPTION}}|Welcome to the KamiCommon NMS API documentation. Choose a version below to browse its Javadocs.|g" | \
          sed "s|{{GITHUB_PATH}}|/Jake-Moore/KamiCommonNMS|g" > temp_index.html

          # Replace the dynamic content placeholder
          awk '
          /{{DYNAMIC_CONTENT}}/ {
              while ((getline line < "dynamic_content.html") > 0) {
                  print line
              }
              close("dynamic_content.html")
              next
          }
          { print }
          ' temp_index.html > index.html

          # Clean up
          rm template.html temp_index.html dynamic_content.html

          echo "Generated index.html"

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📚 Deploy docs for v${{ needs.validate.outputs.version }} - $(date)"
            git push
            echo "✅ Documentation deployed successfully!"
          fi